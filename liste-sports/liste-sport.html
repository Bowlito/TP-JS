<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listes de sports</title>
    <link rel="stylesheet" href="liste-sport.css">
    <script src="liste-sport.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body>
    <h1 class="text-center mt-5">Voici 2 listes de sports</h1>
    <div class="container">
        <div class="row mt-5 justify-content-center">
            <div class="col-4">
                <label for="dispos">Sports disponibles</label>
            <select class="form-select h-100" id="dispos" multiple>
                <option value="foot">Football</option>
                <option value="basket">Basketball</option>
                <option value="rugby">Rugby</option>
                <option value="hockey">Hockey</option>
                <option value="volley">Volley</option>
                <option value="velo">Cyclisme</option>
                <option value="judo">Judo</option>
                <option value="boxe">Boxe</option>
                <option value="tennis">Tennis</option>
                <option value="nage">Natation</option>

            </select>
            </div>
            <div class="col-2 text-center d-flex flex-column">
            <button class="btn btn-success mb-1">></button>
            <button class="btn btn-success mb-1">>></button>
            <button class="btn btn-success mb-1">>>*</button>
            <button class="btn btn-success mb-1"><</button>
            <button class="btn btn-success mb-1"><<</button>
            <button class="btn btn-success mb-1"><<*</button>

            </div>
            <div class="col-4">
                <label for="pref">Sports préférés</label>
            <select class="form-select h-100" id="pref" multiple>
                

            </select>
            </div>

        </div>
    </div>





</body>

</html>
